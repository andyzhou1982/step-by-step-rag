[project]
name = "step-by-step-rag"
version = "3.0.0"
description = "Step-by-Step RAG Tutorial - Day 3"
requires-python = ">=3.11"

# Web Framework
# Web 框架
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "python-multipart>=0.0.22",

    # LangChain (latest versions)
    # LangChain（最新版本）
    "langchain>=1.2.13",
    "langchain-openai>=1.1.11",
    "langchain-community>=0.4.1",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.1",

    # Database
    # 数据库
    "asyncpg>=0.31.0",
    "pgvector>=0.3.6",
    "sqlalchemy[asyncio]>=2.0.0",

    # Utilities
    # 工具
    "python-dotenv>=1.2.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",

    # Document Parsers (Day 2)
    # 文档解析器（Day 2）
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "chardet>=5.2.0",

    # Retrieval Enhancement (Day 3)
    # 检索增强（Day 3）
    "rank-bm25>=0.2.2",           # BM25 for hybrid search / BM25 混合检索
    "numpy>=1.26.0",               # For similarity calculations / 相似度计算
    "sentence-transformers>=3.0.0", # For re-ranking / 重排序
    "jieba>=0.42.1",              # Chinese text segmentation / 中文分词
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Use Tsinghua mirror for faster downloads
# 使用清华镜像源加速下载
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
