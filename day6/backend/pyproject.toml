[project]
name = "step-by-step-rag"
version = "3.0.0"
description = "Step-by-Step RAG Tutorial - Day 3"
requires-python = ">=3.11"

# Web Framework
# Web 框架
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "python-multipart>=0.0.22",
    # LangChain (latest versions)
    # LangChain（最新版本）
    "langchain>=1.2.13",
    "langchain-openai>=1.1.11",
    "langchain-community>=0.4.1",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.1",
    # Database
    # 数据库
    "asyncpg>=0.31.0",
    "pgvector>=0.3.6",
    # Utilities
    # 工具
    "python-dotenv>=1.2.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    # Document Parsers (Day 2)
    # 文档解析器（Day 2）
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "chardet>=5.2.0",
    # Retrieval Enhancement (Day 3)
    # 检索增强（Day 3）
    "rank-bm25>=0.2.2",           # BM25 for hybrid search / BM25 混合检索
    "numpy>=1.26.0",               # For similarity calculations / 相似度计算
    "sentence-transformers>=3.0.0", # For re-ranking / 重排序
    "jieba>=0.42.1",              # Chinese text segmentation / 中文分词
    # Evaluation & Observability (Day 5)
    # 评估与可观测性（Day 5）
    "ragas>=0.1.0",               # RAG evaluation framework / RAG 评估框架
    "datasets>=2.14.0",           # Hugging Face datasets / Hugging Face 数据集
    "opentelemetry-api>=1.20.0",  # OpenTelemetry API / OpenTelemetry API
    "opentelemetry-sdk>=1.20.0",  # OpenTelemetry SDK / OpenTelemetry SDK
    "structlog>=23.0.0",          # Structured logging / 结构化日志
    # Security & Authentication (Day 6)
    # 安全与认证（Day 6）
    "passlib>=1.7.4",              # Password hashing / 密码哈希
    "bcrypt<4.0.0",                # bcrypt 3.x for passlib compatibility / passlib 兼容的 bcrypt 3.x
    "python-jose[cryptography]>=3.3.0",  # JWT tokens / JWT tokens
    "email-validator>=2.1.0",      # Email validation / 邮箱验证
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


