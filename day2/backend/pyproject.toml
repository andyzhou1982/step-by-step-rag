[project]
name = "step-by-step-rag"
version = "2.0.0"
description = "Step-by-Step RAG Tutorial - Day 2"
requires-python = ">=3.11"

# Web Framework
# Web 框架
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "python-multipart>=0.0.22",
    # LangChain (latest versions)
    # LangChain（最新版本）
    "langchain>=1.2.13",
    "langchain-openai>=1.1.11",
    "langchain-community>=0.4.1",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.1",
    # Database
    # 数据库
    "asyncpg>=0.31.0",
    "pgvector>=0.3.6",
    # Utilities
    # 工具
    "python-dotenv>=1.2.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    # Document Parsers (Day 2 additions)
    # 文档解析器（Day 2 新增）
    "pypdf>=5.0.0",              # PDF parsing / PDF 解析
    "python-docx>=1.1.0",        # Word parsing / Word 解析
    "beautifulsoup4>=4.12.0",    # HTML parsing / HTML 解析
    "lxml>=5.0.0",               # XML/HTML backend / XML/HTML 后端
    "chardet>=5.2.0",            # Encoding detection / 编码检测
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Use Tsinghua mirror for faster downloads
# 使用清华镜像源加速下载
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
